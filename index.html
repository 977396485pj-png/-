<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI科技城 - 高性价比AI账号</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <!-- tsParticles -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tsparticles/3.9.1/tsparticles.bundle.min.js"></script>

  <style>
    body {
      background: #0a0a0a;
      font-family: 'Microsoft YaHei', system-ui, sans-serif;
      overflow-x: hidden;
    }
    #tsparticles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    .glass {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .neon-text {
      text-shadow: 0 0 25px #67e8f9, 0 0 40px #c084fc;
    }
    .content {
      position: relative;
      z-index: 10;
    }
  </style>
</head>
<body class="text-white min-h-screen">
  <!-- 粒子背景 -->
  <div id="tsparticles"></div>

  <div class="content max-w-4xl mx-auto px-6 py-12">
    <!-- 头部 -->
    <div class="text-center mb-12">
      <h1 class="text-6xl font-bold mb-4 neon-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
        AI科技城
      </h1>
      <p class="text-xl text-cyan-300">5年老店 · 超高性价比 · 品质保障</p>
    </div>

    <!-- 公告 -->
    <div class="glass rounded-3xl p-10 shadow-2xl mb-10 border border-cyan-500/30">
      <div class="flex items-center gap-4 mb-6">
        <i class="fa-solid fa-bullhorn text-3xl text-yellow-400"></i>
        <h2 class="text-3xl font-semibold">重要公告</h2>
      </div>
      <div class="space-y-6 text-lg">
        <p class="leading-relaxed">
          5年老店，超高性价比，低价实惠带品质保障。<br>
          任意问题均可私信老板，售后无忧。
        </p>
        
        <div class="flex flex-wrap gap-6 justify-center text-xl">
          <div class="flex items-center gap-3 bg-white/10 px-6 py-3 rounded-2xl">
            <i class="fa-brands fa-weixin text-green-400"></i>
            <span><strong>微信：</strong> 19268403019</span>
          </div>
          <div class="flex items-center gap-3 bg-white/10 px-6 py-3 rounded-2xl">
            <i class="fa-brands fa-qq text-blue-400"></i>
            <span><strong>QQ：</strong> 3750786731</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 主产品 -->
    <div class="glass rounded-3xl p-10 shadow-2xl border border-purple-500/30">
      <h2 class="text-4xl font-bold mb-8 text-center">【号池】ChatShare.Art</h2>
      
      <div class="grid md:grid-cols-2 gap-8 items-center">
        <div>
          <p class="text-2xl mb-6 leading-relaxed text-cyan-100">
            六大AI Plus会员模型<br>
            <span class="text-cyan-400">国内直连 · 稳定高速</span>
          </p>
          
          <a href="http://chatshare.art" target="_blank"
             class="block w-full text-center bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 
                    text-white font-bold text-xl py-6 rounded-2xl transition-all hover:scale-105 shadow-lg">
            立即查看详情 →
          </a>
        </div>
        
        <div class="text-center">
          <div class="inline-flex items-center justify-center w-32 h-32 rounded-full border-4 border-cyan-400/50 bg-gradient-to-br from-purple-500/20 to-cyan-500/20">
            <i class="fa-solid fa-robot text-7xl text-cyan-300"></i>
          </div>
        </div>
      </div>
    </div>

    <div class="text-center mt-12 text-gray-400">
      <p>✅ 五年老店 · 售后无忧 · 品质优先</p>
    </div>
  </div>

  <footer class="text-center py-8 text-gray-500 text-sm relative z-10">
    AI科技城 © 2026 | 私信老板获取更多服务
  </footer>

  <script>
    tsParticles.load("tsparticles", {
      background: { color: "#0a0a0a" },
      fpsLimit: 120,
      particles: {
        color: { value: ["#67e8f9", "#c084fc", "#a5b4fc"] },
        links: { color: "#64748b", distance: 150, enable: true, opacity: 0.2, width: 1 },
        move: { enable: true, speed: 0.8, direction: "none", random: false, straight: false, outModes: "out" },
        number: { value: 80, density: { enable: true, area: 800 } },
        opacity: { value: 0.6, random: true },
        shape: { type: "circle" },
        size: { value: { min: 1, max: 4 } }
      },
      interactivity: {
        events: {
          onHover: { enable: true, mode: "repulse" },
          onClick: { enable: true, mode: "push" },
          resize: true
        },
        modes: {
          repulse: { distance: 120, duration: 0.4 },
          push: { quantity: 4 }
        }
      },
      detectRetina: true
    });
  </script>
</body>
</html>
