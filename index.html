<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI科技城</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:sans-serif;
  margin:0;
  padding:20px;
}

h1{
  text-align:center;
}

.card{
  background:#1e293b;
  padding:15px;
  margin:10px;
  border-radius:10px;
}

.price{
  color:#22c55e;
  font-size:18px;
}

.tag{
  background:red;
  padding:3px 6px;
  border-radius:5px;
  font-size:12px;
  margin-left:5px;
}

button{
  background:#3b82f6;
  border:none;
  padding:10px;
  color:white;
  border-radius:6px;
  margin-top:10px;
}
</style>
</head>

<body>

<h1 id="title">加载中...</h1>
<p id="notice"></p>

<div id="list"></div>

<script>
fetch("products.json")
.then(res => res.json())
.then(data => {

  document.getElementById("title").innerText = data.siteName;
  document.getElementById("notice").innerText = data.notice;

  let html = "";

  data.products.forEach(p => {
    html += `
    <div class="card">
      <h3>${p.name} <span class="tag">${p.tag || ""}</span></h3>
      <p>${p.desc}</p>
      <p class="price">${p.price}</p>
      <button onclick="alert('${data.contact}')">联系购买</button>
    </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
});
</script>

</body>
</html>
