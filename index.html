<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI科技城</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      color: #333;
    }
    header {
      background-color: #FFEB3B;
      padding: 10px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    .announcement {
      background-color: #FFEB3B;
      padding: 10px;
      text-align: center;
    }
    .announcement p {
      margin: 0;
      font-size: 16px;
    }
    .product-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
    }
    .product-card {
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      margin: 10px;
      width: 250px;
      padding: 15px;
      text-align: center;
      border-radius: 8px;
      font-size: 16px;
    }
    .product-card h2 {
      font-size: 18px;
      color: #444;
    }
    .product-card p {
      font-size: 14px;
      margin: 5px 0;
    }
    .buy-button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      font-size: 16px;
      border-radius: 5px;
      margin-top: 10px;
      display: inline-block;
    }
    .buy-button:hover {
      background-color: #45a049;
    }
    #success-popup {
      display: none;
      background-color: rgba(0,0,0,0.5);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      text-align: center;
      padding-top: 20%;
      color: white;
    }
    #success-popup div {
      background: #333;
      padding: 20px;
      border-radius: 8px;
    }
    #success-popup button {
      background-color: red;
      padding: 10px;
      color: white;
      border: none;
      border-radius: 5px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<header>
  <h1>AI科技城</h1>
</header>

<div class="announcement">
  <p>【公告】<br> 5年老店， 全网最具性价比， 超高质量，纯手工注册充值，低价实惠带质量保障。</p>
  <p>【售后】任何问题均可私信老板，售后无忧<br> 微信：19268403019 (优先微信联系)<br> QQ：3750786731</p>
</div>

<div class="product-container">
  <!-- Example Products -->
  <div class="product-card">
    <h2>ChatGPT Plus 正规充值卡密</h2>
    <p>价格: ¥170</p>
    <p>库存: 充足</p>
    <a href="https://qr.alipay.com/fkx163781mj6oyfpigqp28c?return_url=https://yourdomain.com/thank_you_page" class="buy-button" target="_blank">立即购买</a>
  </div>

  <div class="product-card">
    <h2>ChatGPT Plus 共享账号</h2>
    <p>价格: ¥150</p>
    <p>库存: 充足</p>
    <a href="https://qr.alipay.com/fkx163781mj6oyfpigqp28c?return_url=https://yourdomain.com/thank_you_page" class="buy-button" target="_blank">立即购买</a>
  </div>

  <!-- Add all other products similarly -->

</div>

<!-- Success popup -->
<div id="success-popup">
  <div>
    <p>感谢您的购买！<br>由于本产品账号现开，麻烦添加微信：<strong>19268403019</strong>，进行获取。</p>
    <button onclick="closePopup()">关闭</button>
  </div>
</div>

<script>
  // Check if the user comes from the payment success page
  function checkPaymentSuccess() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('payment_status') && urlParams.get('payment_status') === 'success') {
      document.getElementById('success-popup').style.display = 'block';
    }
  }

  // Close the popup
  function closePopup() {
    document.getElementById('success-popup').style.display = 'none';
  }

  // Automatically check payment status on page load
  window.onload = checkPaymentSuccess;
</script>

</body>
</html>
